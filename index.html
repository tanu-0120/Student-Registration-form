<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
<link href="style.css" rel="stylesheet">
</head>
<body>
    <div class="form-container">
        <h2>Student Registration Form</h2>

        <form>
            <div class="form-group">
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="course">Course/Program:</label>
                <select id="course" name="course" required>
                    <option value="" disabled selected>Select your course</option>
                    <option value="bcs">B.Sc. Computer Science</option>
                    <option value="bca">BCA</option>
                    <option value="btech">B.Tech IT</option>
                    <option value="mcs">M.Sc. Computer Science</option>
                </select>
            </div>

            <div class="form-group">
                <label>Gender:</label>
                <div class="radio-group">
                    <label><input type="radio" name="gender" value="male" required> Male</label>
                    <label><input type="radio" name="gender" value="female"> Female</label>
                    <label><input type="radio" name="gender" value="other"> Other</label>
                </div>
            </div>

            <div class="form-group">
                <label>Technical Skills / Interests:</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="skills" value="html"> HTML/CSS</label>
                    <label><input type="checkbox" name="skills" value="js"> JavaScript</label>
                    <label><input type="checkbox" name="skills" value="python"> Python</label>
                </div>
            </div>
            <div class="button-group">
                <input type="reset" class="btn btn-reset" value="Reset">
                <input type="submit" class="btn btn-submit" value="Submit">
            </div>

        </form>
    </div>

</body>
</html>
